name: Release

on:
  push:
    tags:
      - "*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show Swift version
        run: swift --version

      - name: Build release binary
        run: swift build -c release --product fltr

      - name: Package binary
        run: |
          chmod +x .build/release/fltr
          ditto -c -k --sequesterRsrc --keepParent .build/release/fltr fltr-macos-${{ matrix.arch }}.zip

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: fltr-macos-${{ matrix.arch }}
          path: fltr-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  generate-sboms:
    name: Generate SBOMs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Swift 6.4 snapshot
        run: |
          curl -fsSLO https://download.swift.org/swiftly/linux/swiftly-1.1.2-$(uname -m).tar.gz
          tar -zxf swiftly-1.1.2-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.local/share/swiftly}/env.sh"
          swiftly install 6.4.x-snapshot
          swiftly use 6.4.x-snapshot
          swift --version

      - name: Generate release SBOMs
        run: scripts/generate_sboms.sh dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: fltr-sboms
          path: dist/fltr-sbom-*.json
          if-no-files-found: error

  build-linux:
    name: Build static Linux (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Swift 6.3.3
        run: |
          curl -fsSLO https://download.swift.org/swiftly/linux/swiftly-1.1.2-$(uname -m).tar.gz
          tar -zxf swiftly-1.1.2-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.local/share/swiftly}/env.sh"
          swiftly install 6.3.3
          swiftly run swift --version
          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Install Swift Static Linux SDK
        run: |
          swiftly run swift sdk install \
            https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b

      - name: Build static release binary with mimalloc
        run: ARCH=${{ matrix.arch }} make linux

      - name: Verify static binary
        run: |
          file .build/${{ matrix.arch }}-swift-linux-musl/release/fltr | grep -F "statically linked"
          nm .build/${{ matrix.arch }}-swift-linux-musl/release/fltr | grep -E '[[:space:]]mi_malloc$'

      - name: Package binary
        run: |
          mkdir dist
          cp .build/${{ matrix.arch }}-swift-linux-musl/release/fltr dist/fltr
          cp LICENSES/mimalloc-MIT.txt dist/LICENSE-mimalloc.txt
          tar -C dist -czf fltr-linux-${{ matrix.arch }}.tar.gz fltr LICENSE-mimalloc.txt

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: fltr-linux-${{ matrix.arch }}
          path: fltr-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-macos, build-linux, generate-sboms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              dist/*
          fi
