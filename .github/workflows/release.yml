name: Release

on:
  push:
    tags:
      - "*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Swift
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "${HOME}/.swiftly/bin/swiftly" init --assume-yes --no-modify-profile --skip-install --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.swiftly}/env.sh"
          swiftly install "$(<.swift-version)"
          swiftly run swift --version
          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Build and package binaries
        run: |
          mkdir dist
          for arch in arm64 x86_64; do
            swift build --build-system native -c release --product fltr --arch "${arch}"
            binary_dir="$(swift build --build-system native -c release --arch "${arch}" --show-bin-path)"
            archive_dir="dist/fltr-macos-${arch}"
            mkdir "${archive_dir}"
            cp "${binary_dir}/fltr" "${archive_dir}/fltr"
            chmod +x "${archive_dir}/fltr"
            cp LICENSE THIRD_PARTY_NOTICES.md "${archive_dir}"
            cp -R LICENSES "${archive_dir}/LICENSES"
            ditto -c -k --sequesterRsrc --keepParent "${archive_dir}" "dist/fltr-macos-${arch}.zip"
          done

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: fltr-macos
          path: dist/fltr-macos-*.zip
          if-no-files-found: error

  generate-sboms:
    name: Generate SBOMs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read Swift version
        run: |
          echo "SWIFT_VERSION=$(<.swift-version)" >> "${GITHUB_ENV}"

      - name: Setup Swift
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ env.SWIFT_VERSION }}

      - name: Show Swift version
        run: swift --version

      - name: Generate release SBOMs
        run: scripts/generate_sboms.sh dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: fltr-sboms
          path: dist/fltr-sbom-*.json
          if-no-files-found: error

  build-linux:
    name: Build static Linux
    runs-on: macos-26
    env:
      SWIFT_SDK_NAME: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a_static-linux-0.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Swift
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "${HOME}/.swiftly/bin/swiftly" init --assume-yes --no-modify-profile --skip-install --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.swiftly}/env.sh"
          swiftly install "$(<.swift-version)"
          swiftly run swift --version
          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Install Swift Static Linux SDK
        run: |
          swiftly run swift sdk install \
            https://download.swift.org/swift-6.4.x-branch/static-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 2771036e478c0f9322a1735ce8baa3087ffa1d802ea4dd7ba564854300266bdd

      - name: Build, verify, and package binaries
        run: |
          mkdir dist
          for arch in aarch64 x86_64; do
            ARCH="${arch}" make linux
            binary=".build/${arch}-swift-linux-musl/release/fltr"
            file "${binary}" | grep -F "statically linked"
            nm "${binary}" | grep -E '[[:space:]]mi_malloc$'
            archive_dir="dist/fltr-linux-${arch}"
            mkdir "${archive_dir}"
            cp "${binary}" "${archive_dir}/fltr"
            cp LICENSE THIRD_PARTY_NOTICES.md "${archive_dir}"
            cp -R LICENSES "${archive_dir}/LICENSES"
            tar -C dist -czf "dist/fltr-linux-${arch}.tar.gz" "fltr-linux-${arch}"
          done

          sdk_sbom="$(find "${HOME}/Library/org.swift.swiftpm/swift-sdks" -path "*/${SWIFT_SDK_NAME}.artifactbundle/sbom.spdx.json" -type f -print -quit)"
          test -n "${sdk_sbom}"
          cp "${sdk_sbom}" dist/fltr-sbom-static-linux-sdk.spdx.json

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: fltr-linux
          path: |
            dist/fltr-linux-*.tar.gz
            dist/fltr-sbom-static-linux-sdk.spdx.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-macos, build-linux, generate-sboms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              dist/*
          fi
